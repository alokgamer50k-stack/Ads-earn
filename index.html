<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Earn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 1. Premium Hypnotic Background --- */
        body {
            margin: 0; padding: 0;
            background-color: #000000;
            height: 100dvh; overflow: hidden;
            display: flex; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-orb {
            position: absolute; border-radius: 50%;
            filter: blur(60px); z-index: 1;
            animation: float 8s infinite alternate ease-in-out;
        }
        .orb-1 { width: 350px; height: 350px; background: rgba(10, 132, 255, 0.6); top: -50px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: rgba(191, 90, 242, 0.5); bottom: -50px; right: -50px; animation-duration: 12s; }
        .orb-3 { width: 250px; height: 250px; background: rgba(50, 215, 75, 0.4); top: 35%; left: 20%; animation-duration: 10s; }
        
        @keyframes float {
            0% { transform: translateY(0) translateX(0) scale(1); }
            100% { transform: translateY(50px) translateX(50px) scale(1.1); }
        }

        /* --- 2. Glassmorphism App UI --- */
        #app-container {
            width: 100%; max-width: 414px; height: 100%;
            background: rgba(15, 15, 18, 0.65);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10; position: relative;
            display: flex; flex-direction: column;
        }

        /* --- NEW PREMIUM LOGIN SCREEN --- */
        #login-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 12, 0.85); z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            transition: 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px; border-radius: 24px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 85%;
        }
        .google-btn {
            background: white; color: #333; border: none; padding: 16px 20px;
            border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin-top: 30px; width: 100%;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2); transition: 0.2s;
        }
        .google-btn:active { transform: scale(0.96); }

        /* --- Header --- */
        header {
            padding: 40px 20px 20px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .balance-badge {
            background: rgba(0,0,0,0.5); padding: 10px 16px;
            border-radius: 20px; font-weight: 700; font-size: 18px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .content-area { padding: 25px 20px; flex: 1; overflow-y: auto; }
        .content-area::-webkit-scrollbar { display: none; }
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Buttons & Inputs */
        .glass-btn {
            width: 100%; padding: 20px; margin-bottom: 18px;
            border-radius: 18px; font-size: 16px; font-weight: 600;
            color: white; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255, 255, 255, 0.08); cursor: pointer; transition: 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .glass-btn:active { transform: scale(0.95); }
        .btn-short:hover { background: rgba(10, 132, 255, 0.3); border-color: rgba(10, 132, 255, 0.6); }
        .btn-long:hover { background: rgba(191, 90, 242, 0.3); border-color: rgba(191, 90, 242, 0.6); }

        .glass-input {
            width: 100%; padding: 18px; border-radius: 15px; margin-bottom: 15px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            color: white; font-size: 16px; outline: none;
        }
        .setting-item {
            padding: 20px; background: rgba(255,255,255,0.05);
            border-radius: 15px; margin-bottom: 10px; display: flex;
            justify-content: space-between; align-items: center;
        }

        /* Bottom Nav */
        .glass-nav {
            display: flex; justify-content: space-around; padding: 15px 10px 25px 10px;
            background: rgba(5, 5, 5, 0.85); border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item { color: #8E8E93; font-size: 22px; cursor: pointer; transition: 0.3s; flex: 1; text-align: center; }
        .nav-item.active { color: #0A84FF; text-shadow: 0 0 12px rgba(10,132,255,0.6); transform: translateY(-3px); }
    </style>
</head>
<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div id="app-container">
        
        <div id="login-screen">
            <div class="login-card">
                <i class="fa-solid fa-gem" style="font-size: 50px; color: #0A84FF; margin-bottom: 20px; text-shadow: 0 0 20px rgba(10,132,255,0.5);"></i>
                <h1 style="margin: 0; font-size: 26px; font-weight: 700;">Premium Earn</h1>
                <p style="color: #8E8E93; margin-top: 8px; font-size: 14px;">Log in to access your dashboard</p>
                
                <button class="google-btn" id="login-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>

        <header>
            <div>
                <p style="color: #8E8E93; font-size: 13px; margin:0 0 5px 0;">Welcome back,</p>
                <h2 style="margin: 0; font-size: 20px; font-weight: 700;" id="user-name">Loading...</h2>
            </div>
            <div class="balance-badge">
                <i class="fa-solid fa-coins" style="color: #FFD700; margin-right: 5px;"></i> <span id="user-coins">0</span>
            </div>
        </header>

        <div class="content-area">
            
            <div id="tab-home" class="section active">
                <h3 style="color: #8E8E93; font-size: 14px; margin-bottom: 15px;">Earn Rewards</h3>
                <button class="glass-btn btn-short" onclick="alert('Ads Setup Pending')">
                    <i class="fa-solid fa-bolt" style="color: #0A84FF; font-size: 20px;"></i> Watch Short Ad (1 Coin)
                </button>
                <button class="glass-btn btn-long" onclick="alert('Links Setup Pending')">
                    <i class="fa-solid fa-link" style="color: #BF5AF2; font-size: 20px;"></i> Complete Long Task (2 Coins)
                </button>
            </div>

            <div id="tab-wallet" class="section">
                <h2 style="margin: 0 0 20px 0;">Withdraw Funds</h2>
                <input type="text" class="glass-input" placeholder="Enter UPI ID">
                <button class="glass-btn btn-short" style="background: #32D74B; border-color: #32D74B;">
                    Withdraw Now
                </button>
                <p style="color: #8E8E93; font-size: 12px; text-align: center;">Minimum withdrawal: 500 Coins (₹50)</p>
            </div>

            <div id="tab-settings" class="section">
                <h2 style="margin: 0 0 20px 0;">Settings</h2>
                <div class="setting-item">
                    <span><i class="fa-solid fa-headset" style="color: #0A84FF; margin-right: 10px;"></i> Help & Support</span>
                    <i class="fa-solid fa-chevron-right" style="color: #8E8E93;"></i>
                </div>
                <div class="setting-item" id="logout-btn" style="cursor: pointer; color: #FF3B30;">
                    <span><i class="fa-solid fa-right-from-bracket" style="margin-right: 10px;"></i> Logout</span>
                </div>
            </div>

        </div>

        <nav class="glass-nav">
            <div class="nav-item active" onclick="switchTab('tab-home', this)"><i class="fa-solid fa-house"></i></div>
            <div class="nav-item" onclick="switchTab('tab-wallet', this)"><i class="fa-solid fa-wallet"></i></div>
            <div class="nav-item" onclick="switchTab('tab-settings', this)"><i class="fa-solid fa-gear"></i></div>
        </nav>
    </div>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }
    </script>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        
        const provider = new GoogleAuthProvider();

        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("Login Error: " + error.message);
            });
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => location.reload());
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.transform = 'translateY(-100%)';
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-coins').innerText = "0"; 
            } else {
                document.getElementById('login-screen').style.transform = 'translateY(0)';
            }
        });
    </script>

</body>
</html>
